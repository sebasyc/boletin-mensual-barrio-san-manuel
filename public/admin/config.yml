backend:
  name: github
  repo: sebasyc/boletin-mensual-barrio-san-manuel
  branch: main

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "home"
    label: "Boletín mensual"
    files:
      - file: "content/home.json"
        label: "Contenido del boletín"
        name: "home"
        fields:
          - { label: "Título", name: "site_title", widget: "string" }
          - { label: "Subtítulo", name: "site_subtitle", widget: "string" }
          - { label: "Barrio", name: "site_neighborhood", widget: "string" }
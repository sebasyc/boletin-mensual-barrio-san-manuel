backend:
  name: github
  repo: sebasyc/boletin-mensual-barrio-san-manuel
  branch: main

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "home"
    label: "Boletín mensual"
    files:
      - file: "content/home.json"
        label: "Contenido del boletín"
        name: "home"
        fields:
          - { label: "Subtítulo", name: "site_subtitle", widget: "string" }
          - { label: "Barrio", name: "site_neighborhood", widget: "string" }

          - { label: "Título de horarios", name: "schedule_title", widget: "string" }
          - label: "Horarios"
            name: "schedule_items"
            widget: "list"
            fields:
              - { label: "Actividad", name: "activity", widget: "string" }
              - { label: "Día y hora", name: "day_time", widget: "string" }
              - label: "Descripción"
                name: "description"
                widget: "list"

          - { label: "Título de actividades semanales", name: "weekly_schedule_title", widget: "string" }
          - label: "Actividades semanales"
            name: "weekly_schedule_items"
            widget: "list"
            fields:
              - { label: "Actividad", name: "activity", widget: "string" }
              - { label: "Día", name: "day", widget: "string" }
              - { label: "Hora", name: "time", widget: "string" }
              - label: "Descripción"
                name: "description"
                widget: "list"

          - { label: "Título de anuncios", name: "announcements_title", widget: "string" }
          - label: "Anuncios"
            name: "announcements"
            widget: "list"
            fields:
              - { label: "Título del anuncio", name: "title", widget: "string" }
              - { label: "Descripción", name: "description", widget: "text" }
              - { label: "Día y hora", name: "day_time", widget: "string" }

          - { label: "Título de cumpleaños", name: "birthdays_title", widget: "string" }
          - label: "Cumpleaños"
            name: "birthdays"
            widget: "list"
            fields:
              - { label: "Nombre", name: "name", widget: "string" }
              - { label: "Fecha", name: "date", widget: "string" }

          - { label: "Título de conociendo al hermano/a", name: "member_spotlight_title", widget: "string" }
          - { label: "Foto", name: "member_spotlight_photo", widget: "image" }
          - { label: "Nombre del hermano o hermana", name: "member_spotlight_name", widget: "string" }
          - label: "Características"
            name: "member_spotlight_characteristics"
            widget: "list"
          - { label: "Autor de la entrevista", name: "member_spotlight_interviewer", widget: "string" }

          - { label: "Pensamiento espiritual", name: "scripture_title", widget: "string" }
          - { label: "Escritura", name: "scripture_text", widget: "string" }
          - { label: "Pasaje", name: "scripture_passage", widget: "string" }
          - { label: "Testimonio", name: "scripture_testimony", widget: "string" }
          - { label: "Autor del testimonio", name: "scripture_author", widget: "string" }

          - { label: "Título Ven, Sígueme", name: "come_follow_me_title", widget: "string" }
          - { label: "Imagen", name: "come_follow_me_image", widget: "image" }
          - { label: "Personaje bíblico", name: "come_follow_me_character", widget: "string" }
          - { label: "Descripción del personaje", name: "come_follow_me_character_description", widget: "text" }
          - { label: "Cita del apóstol", name: "come_follow_me_quote", widget: "text" }
          - { label: "Autor de la cita", name: "come_follow_me_quote_author", widget: "string" }
          - { label: "Reflexión o moraleja", name: "come_follow_me_reflection", widget: "text" }
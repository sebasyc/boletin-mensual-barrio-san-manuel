<body>
    <main>
        <a class="btn-float-lds" href="https://www.churchofjesuschrist.org/?lang=spa" target="_blank">
            <img src="src/assets/images/logo-lds.png" alt="churchofjesuschrist">
        </a>
        <a class="btn-float-instagram" href="https://www.instagram.com/barriosanmanuel?utm_source=ig_web_button_share_sheet&igsh=ZDNlZDc0MzIxNw==" target="_blank">
            <i class="bi bi-instagram"></i>
        </a>

        <header class="top-header">
            <a class="nav-logo" href="#">
                <span>El Sinaí</span>
            </a>
            <nav>
                <ul class="nav-menu">
                    <li class="nav-item">
                        <a href="#schedule-section">
                            <span>Horarios dominicales</span>
                            <i class="bi bi-arrow-right"></i>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#weekly-schedule-section">
                            <span>Actividades semanales</span>
                            <i class="bi bi-arrow-right"></i>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#announcements-section">
                            <span>Anuncios</span>
                            <i class="bi bi-arrow-right"></i>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#birthdays-section">
                            <span>Cumpleaños del mes</span>
                            <i class="bi bi-arrow-right"></i>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#member-spotlight-section">
                            <span>Conociendo a ...</span>
                            <i class="bi bi-arrow-right"></i>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#scripture-section">
                            <span>Pensamiento espiritual</span>
                            <i class="bi bi-arrow-right"></i>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#come-follow-me-section">
                            <span>Destacado del ven sigueme</span>
                            <i class="bi bi-arrow-right"></i>
                        </a>
                    </li>
                </ul>
            </nav>
            <div class="icon-hamburger" id="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </header>

        <section class="hero-boletin">
            <div class="header-bg-cloud"></div>
            <div class="container hero-title">
                <h1 data-parallax="0.4">El Sinaí</h1>
            </div>
            <div class="container hero-info" data-parallax="0.2">
                <h2 id="site-subtitle"></h2>
                <h3 id="site-neighborhood"></h3>
                <div class="hero-btn">
                    <a href="https://maps.app.goo.gl/kwCCXGnawGcAkQRX9" target="_blank">
                        <i class="bi bi-geo-alt-fill"></i>
                        <span>Nuestra capilla</span>
                    </a>
                </div>
            </div>
            <span class="gradient-bottom"></span>
        </section>

        <section class="schedule-section" id="schedule-section">
            <div class="container">
                <div class="titles light">
                    <h2 id="schedule-title"></h2>
                </div>
                <div class="accordion" id="schedule-accordion"></div>
            </div>
        </section>

        <section class="weekly-schedule-section" id="weekly-schedule-section">
            <div class="container">
                <div class="titles dark">
                    <h2 id="weekly-schedule-title"></h2>
                </div>
                <div class="accordion" id="weekly-schedule-accordion"></div>
            </div>
        </section>

        <section class="announcements-section" id="announcements-section">
            <div class="container">
                <div class="titles light">
                    <h2 id="announcements-title"></h2>
                </div>
                <div id="announcements-list"></div>
            </div>
        </section>

        <section class="birthdays-section" id="birthdays-section">
            <div class="container">
                <div class="titles dark">
                    <h2 id="birthdays-title"></h2>
                </div>
                <ul id="birthdays-list"></ul>
            </div>
        </section>

        <section class="member-spotlight-section" id="member-spotlight-section">
            <div class="container">
                <div class="titles light">
                    <h2 id="member-spotlight-title"></h2>
                </div>
                <div class="photo-member">
                    <img id="member-spotlight-photo" src="" alt="Foto del miembro" />
                </div>
                <h3 id="member-spotlight-name"></h3>
                <ul id="member-spotlight-characteristics"></ul>
                <p id="member-spotlight-description"></p>
                <span class="autor-spotlight" id="member-spotlight-interviewer"></span>
            </div>
        </section>

        <section class="scripture-section" id="scripture-section">
            <div class="container">
                <div class="titles dark">
                    <h2 id="scripture-title"></h2>
                </div>
                <p class="scripture" id="scripture-text"></p>
                <span class="scripture-passage" id="scripture-passage"></span>
                <blockquote>
                    <i class="bi bi-quote"></i>
                    <p class="scripture-testimony" id="scripture-testimony"></p>
                    <cite class="scripture-author" id="scripture-author"></cite>
                </blockquote>
            </div>
        </section>

        <section class="come-follow-me-section" id="come-follow-me-section">
            <div class="container">
                <div class="titles light">
                    <h2 id="come-follow-me-title"></h2>
                </div>
                <div class="box-img">
                    <img id="come-follow-me-image" src="" alt="Personaje bíblico" />
                </div>
                <h3 id="come-follow-me-character"></h3>
                <p class="description" id="come-follow-me-character-description"></p>
                <blockquote>
                    <i class="bi bi-quote"></i>
                    <p class="quote" id="come-follow-me-quote"></p>
                    <cite id="come-follow-me-quote-author"></cite>
                </blockquote>
                <p class="reflection" id="come-follow-me-reflection"></p>
            </div>
        </section>

    </main>
    <script type="module" src="/src/main.js"></script>

</html>

<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Boletín mensual barrio San Manuel</title>
</head>
<body>

  <!-- Portada -->
  <header>
    <img id="hero-image" src="" alt="Portada del boletín" />
    <h1 id="hero-title"></h1>
    <p id="hero-subtitle"></p>
  </header>

  <!-- Horarios -->
  <section id="schedule-section">
    <h2 id="schedule-title"></h2>
    <ul id="schedule-list"></ul>
  </section>

  <!-- Avisos del mes -->
  <section id="announcements-section">
    <h2 id="announcements-title"></h2>
    <div id="announcements-list"></div>
  </section>

  <!-- Reflexión del párroco -->
  <section id="reflection-section">
    <h2 id="reflection-title"></h2>
    <p id="reflection-text"></p>
    <p id="reflection-author"></p>
  </section>

  <!-- Contacto -->
  <footer id="contact-section">
    <h2 id="contact-title"></h2>
    <p id="contact-address"></p>
    <p id="contact-phone"></p>
    <p id="contact-email"></p>
  </footer>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
